name: UI Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start application
        env:
          JWT_SECRET: ci-test-secret
        run: |
          docker compose up -d --build db backend frontend
          for i in {1..30}; do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
          docker compose --profile tools run --rm seed
      - name: Run UI tests
        env:
          UI_BASE_URL: http://localhost:5173
          TEST_USERNAME: qa.user@example.com
          TEST_PASSWORD: Password123!
        run: pytest -m ui --browser chromium --tracing retain-on-failure --screenshot only-on-failure
      - name: Upload UI artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-artifacts
          path: |
            test-results/
            reports/
