name: API Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run API tests
        env:
          JWT_SECRET: ci-test-secret
        run: |
          mkdir -p reports
          pytest -m api --junitxml=reports/api-junit.xml --html=reports/api-report.html --self-contained-html
      - name: Upload API reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: reports/
