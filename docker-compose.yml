services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brivo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brivo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/brivo
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  seed:
    build: ./backend
    command: python -m app.seed
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/brivo
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
    depends_on:
      backend:
        condition: service_started
    profiles: ["tools"]

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
