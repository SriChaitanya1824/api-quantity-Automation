[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B904", "E501", "UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["backend", "."]
markers = [
    "api: REST API tests",
    "ui: Playwright browser tests",
    "smoke: Critical smoke tests",
    "regression: Regression test suite",
    "performance: Locust or performance smoke tests",
]
